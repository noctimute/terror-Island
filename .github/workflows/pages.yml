name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is plain static files; publish only what the page needs.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html engine .nojekyll _site/
          # every top-level folder with its own index.html is a city page (lumama/, taipei/, ...)
          for d in */; do
            d=${d%/}
            if [ "$d" != engine ] && [ "$d" != _site ] && [ -f "$d/index.html" ]; then cp -r "$d" _site/; fi
          done
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
