<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A8201A">
<title>TERROR ISLAND 恐怖島</title>
<meta name="description" content="用六邊形拼成城市的互動地圖，整理真實新聞事件並附上原始來源。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
  :root { --paper: #f5f0e8; --ink: #1b1517; --muted: #8a7f7a; --accent: #a8201a; --accent2: #d2452f; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 20%, #2a2140 0%, #120f16 65%); color: var(--paper); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; display: grid; place-items: center; padding: 48px 16px; }
  main { width: min(880px, 100%); }
  .eyebrow { font: 700 12px ui-monospace, monospace; letter-spacing: 0.2em; color: var(--accent2); }
  h1 { margin: 10px 0 8px; font: 900 clamp(44px, 9vw, 84px)/1 "Noto Serif TC", serif; color: var(--accent2); }
  h1 span { color: var(--paper); }
  .lead { margin: 0 0 36px; color: #cfc6bd; line-height: 1.8; }
  .cities { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .city { position: relative; display: block; padding: 26px 24px; border-radius: 18px; background: var(--paper); color: var(--ink); text-decoration: none; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); transition: transform 0.2s; overflow: hidden; }
  a.city:hover { transform: translateY(-4px); }
  .city .num { font: 900 54px/1 "Noto Serif TC", serif; color: var(--accent); }
  .city h2 { margin: 8px 0 6px; font: 900 26px "Noto Serif TC", serif; }
  .city p { margin: 0; font-size: 13px; line-height: 1.7; color: #4a4042; }
  .city .go { display: inline-block; margin-top: 18px; font-size: 13px; font-weight: 700; color: var(--accent); }
  .city.soon { background: #2a2430; color: #9a8f8a; }
  .city.soon .num, .city.soon .go { color: #6f6461; }
  .city.soon p { color: #8a7f7a; }
  .note { margin-top: 32px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { .city { transition: none; } }
</style>
<script data-goatcounter="https://terrorisland.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <div class="eyebrow">TERROR ISLAND</div>
  <h1>恐怖<span>島</span></h1>
  <p class="lead">每座城市拆成一格格六邊形，每一座島都是一串真實新聞。<br>選一座城市，看看它發生過什麼。</p>
  <div class="cities">
    <a class="city" href="./lumama/">
      <div class="num">20</div>
      <h2>台中恐怖島</h2>
      <p>墜落、漂浮、氣爆火災、垃圾山、廚餘、公安災害、食安、貪瀆、國安、無聲、兒少、賣地、髒川、標案、詐騙、毒駕、火燒山、空城、噤聲、購物等 20 座島，每則事件附新聞來源。</p>
      <span class="go">進入 →</span>
    </a>
    <div class="city soon" aria-disabled="true">
      <div class="num">—</div>
      <h2>台北</h2>
      <p>即將推出。</p>
      <span class="go">敬請期待</span>
    </div>
  </div>
  <p class="note">開放中的島嶼收錄經新聞報導查證的真實事件，文字只摘要報導內容並附上來源，已拿掉姓名等個人資訊。</p>
</main>
</body>
</html>
